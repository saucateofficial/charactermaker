<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karakter Atölyesi · Character Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050203;--tx:#f3eaea;--mu:#a89a9c;--rd:#c1121f;--ln:#ffffff26;--cd:#ffffff0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(60% 40% at 50% 0,#5a0a10 0,transparent 70%) no-repeat;color:var(--tx);font:300 15px/1.6 Outfit,system-ui,sans-serif;min-height:100vh}
nav{display:flex;align-items:center;gap:12px;padding:16px 22px}
.lg{border:1px solid var(--ln);padding:2px 10px;letter-spacing:2px}
.sp{flex:1}
.pill{background:none;color:var(--tx);border:1px solid var(--tx);border-radius:99px;padding:7px 18px;font:inherit;font-size:13px;cursor:pointer}
.pill.w{background:#fff;color:#7a0b13;border-color:#fff;font-weight:600}
.pill:disabled{opacity:.5}
main{max-width:920px;margin:0 auto;padding:0 20px 60px}
.hero{text-align:center;padding:50px 0 30px}
.hero small{letter-spacing:4px;font-size:11px;color:var(--mu)}
h1{font-weight:400;letter-spacing:6px;font-size:clamp(28px,7vw,52px);margin:10px 0;line-height:1.15}
h2{font-weight:600;font-size:26px;text-align:center;margin:30px 0 18px}
.mu{color:var(--mu)}
.row{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 18px;justify-content:center;flex-wrap:wrap}
.card{width:150px;height:200px;border-radius:14px;border:1px solid var(--ln);background:var(--cd) center/cover;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end}
.card:hover{border-color:var(--rd);box-shadow:0 0 24px #c1121f55}
